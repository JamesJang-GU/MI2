<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MI2 — Global Freight &amp; Trade Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#000; --panel:#0b0b0b; --panel2:#101010; --line:#2b2b2b;
    --amber:#ffa500; --amber2:#ff8c00; --txt:#e6e6e6; --dim:#8f8f8f;
    /* 한국 시장 관례: 상승=적색, 하락=청색 */
    --up:#ff4d4d; --down:#58a6ff; --flat:#9a9a9a;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,"Courier New",
           "Malgun Gothic",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--mono)}
  .topbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;
          padding:8px 12px;border-bottom:2px solid var(--amber);
          background:linear-gradient(180deg,#151000,#000)}
  .topmeta{color:var(--dim);font-size:11px;margin-left:auto;display:flex;
           flex-wrap:wrap;gap:6px;align-items:center}
  .chip{border:1px solid var(--line);padding:1px 7px;font-size:10px;color:var(--dim)}
  .chip.ok{color:var(--up);border-color:#5a2430}
  .chip.fail{color:var(--down);border-color:#1d3a5a}
  /* 상·하단 2행 동일 높이 */
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
        grid-template-rows:repeat(2,minmax(430px,1fr));gap:8px;padding:8px;
        min-height:calc(100vh - 92px)}
  @media(max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));
        grid-template-rows:none;grid-auto-rows:auto;min-height:0}}
  @media(max-width:680px){.grid{grid-template-columns:1fr}}
  .box{background:var(--panel);border:1px solid var(--line);display:flex;
       flex-direction:column;min-width:0}
  .box>header{display:flex;align-items:center;gap:8px;padding:6px 8px;
              border-bottom:1px solid var(--line);background:var(--panel2)}
  .code{color:#000;background:var(--amber);font-weight:700;font-size:11px;
        padding:1px 6px;letter-spacing:.08em}
  .ttl{color:var(--amber);font-size:12px;letter-spacing:.06em;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
  .go{margin-left:auto;color:var(--amber);border:1px solid var(--amber2);
      font-size:10px;padding:2px 7px;text-decoration:none;letter-spacing:.05em;
      white-space:nowrap}
  .go:hover{background:var(--amber);color:#000}
  .go.off{color:var(--dim);border-color:var(--line);cursor:default}
  .body{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
  .asof{color:var(--dim);font-size:10px;letter-spacing:.04em}
  .lbl{color:var(--dim);font-size:11px;margin-bottom:3px;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
  .val{color:#fff;font-size:24px;font-weight:700;line-height:1.15;
       font-variant-numeric:tabular-nums;word-break:break-all}
  .val em{font-style:normal;font-size:11px;color:var(--dim);margin-left:4px}
  .chg{font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums}
  .chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--flat)}
  /* 2단 (SCFI/BDI, 선박수/TEU, CRUDE/VLSFO) */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1 1 auto;min-height:0}
  .duo .cell{background:var(--panel2);border:1px solid var(--line);padding:7px;
             display:flex;flex-direction:column;gap:5px;min-width:0;min-height:0}
  .duo .val{font-size:19px}
  .celltitle{color:var(--amber);font-size:11px;letter-spacing:.08em;
             border-bottom:1px dashed #2a2a2a;padding-bottom:4px}
  /* 미니 블록 (숫자 + 스파크라인) */
  .mini{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0}
  .mini .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .mini .row .v{color:#fff;font-size:14px;font-weight:700;
                font-variant-numeric:tabular-nums;white-space:nowrap}
  .mini .row .v em{font-style:normal;font-size:10px;color:var(--dim);margin-left:3px}
  .sparkbox{height:36px;flex:1 1 auto;min-height:26px;position:relative}
  .chartbox{flex:1 1 auto;min-height:70px;position:relative}
  /* 3단 (TAC 항로) */
  .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .trio .cell{background:var(--panel2);border:1px solid var(--line);padding:6px;min-width:0}
  .trio .val{font-size:16px}
  .subrow{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed #222;
          padding-top:6px;font-size:11.5px;align-items:baseline}
  .subrow .v{color:var(--txt);font-variant-numeric:tabular-nums;text-align:right}
  .subrow .v em{font-style:normal;font-size:10px;color:var(--dim);margin-left:3px}
  /* 거시 3단 스택 */
  .stack{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0}
  .stack .grp{background:var(--panel2);border:1px solid var(--line);padding:6px 7px;
              display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
  .stack .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .stack .v{color:#fff;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .stack .v em{font-style:normal;font-size:10px;color:var(--dim);margin-left:3px}
  .stack .chartbox{flex:1 1 auto;min-height:48px;margin-top:4px}
  /* 헤더 기준일: 작고 회색톤 */
  .ref{color:#8f8f8f;font-size:10px;margin-left:8px;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
  /* 상단 브랜드 바 */
  .logo{background:var(--amber);color:#000;font-weight:800;font-size:14px;
        padding:2px 9px;letter-spacing:.14em}
  .brandname{color:#fff;font-size:12px;letter-spacing:.24em;font-weight:600;
             white-space:nowrap}
  .sectors{color:var(--dim);font-size:10px;letter-spacing:.2em;
           border-left:1px solid var(--line);padding-left:12px;white-space:nowrap}
  #clk{color:var(--amber);font-size:11px;margin-right:12px;white-space:nowrap}
  @media(max-width:900px){.sectors{display:none}}
  /* 포워더 1위 헤더 */
  .fwdhead{display:flex;align-items:center;gap:8px}
  .flagimg{width:22px;height:16px;flex:none;border:1px solid #333;background:#111}
  .fname{color:#fff;font-size:16px;font-weight:700;letter-spacing:.03em;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rk1{margin-left:auto;color:#000;background:var(--amber);font-size:10px;
       padding:1px 6px;font-weight:700;flex:none}
  footer{color:var(--dim);font-size:10px;letter-spacing:.08em;padding:6px 12px 18px;
         border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px}
  footer b{color:var(--amber);font-weight:400}
  .err{color:var(--down);font-size:11px}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">MI2</span>
  <span class="brandname">GLOBAL FREIGHT &amp; TRADE INTELLIGENCE</span>
  <span class="sectors">OCEAN · AIR · ENERGY · MACRO</span>
  <span class="topmeta"><span id="clk"></span><span id="meta">LOADING…</span></span>
</div>
<main class="grid" id="grid"></main>
<footer>
  <span><b>AUTO-CRAWL</b> DAILY 00:00 KST · GITHUB ACTIONS</span>
  <span><b>↗/↘</b> 직전 크롤링 대비 증감 (숫자, %) · <b style="color:var(--up)">적색=상승</b> <b style="color:var(--down)">청색=하락</b></span>
  <span id="footmeta"></span>
</footer>
<script>
/* 서울 시간 라이브 시계 */
function tick(){
  const now = new Date();
  const d = now.toLocaleDateString("sv-SE", {timeZone: "Asia/Seoul"});
  const t = now.toLocaleTimeString("en-GB", {timeZone: "Asia/Seoul", hour12: false});
  const el = document.getElementById("clk");
  if (el) el.textContent = `SEOUL ${d} ${t} KST`;
}
tick(); setInterval(tick, 1000);

const AMBER = "#ffa500";
const LINES = ["#ffa500", "#79c0ff", "#d2a8ff"];
const ROUTE_SHORT = {
  "Frankfurt-North America": "FRA→N.AM",
  "Hong Kong-Europe": "HKG→EUR",
  "Hong Kong-North America": "HKG→N.AM",
};

function fmt(v){
  if (v === null || v === undefined) return "-";
  const n = Number(v);
  if (!isFinite(n)) return String(v);
  return n.toLocaleString("ko-KR", {maximumFractionDigits: 2});
}
function unitHtml(u){ return u ? `<em>${u}</em>` : ""; }
function chgHtml(m){
  if (m.change === null || m.change === undefined ||
      m.pct === null || m.pct === undefined)
    return `<span class="chg flat">─</span>`;
  const dir = m.change > 0 ? "up" : m.change < 0 ? "down" : "flat";
  const arrow = m.change > 0 ? "↗" : m.change < 0 ? "↘" : "─";
  const mark = m.change > 0 ? "▲" : m.change < 0 ? "▼" : "";
  const sign = m.change > 0 ? "+" : "";
  return `<span class="chg ${dir}">${arrow} (${sign}${fmt(m.change)}, ${sign}${m.pct.toFixed(1)}%${mark})</span>`;
}
function lineChart(canvas, seriesArr, opts = {}){
  if (!canvas || typeof Chart === "undefined" || !seriesArr || !seriesArr.length) return;
  const multi = seriesArr.length > 1;
  const single = seriesArr.every(s => s.points.length === 1);
  new Chart(canvas, {
    type: "line",
    data: {
      labels: seriesArr[0].points.map(p => p[0]),
      datasets: seriesArr.map((s, i) => ({
        label: s.label,
        data: s.points.map(p => p[1]),
        borderColor: LINES[i % LINES.length],
        backgroundColor: multi ? "transparent" : "rgba(255,165,0,.08)",
        fill: !multi, borderWidth: 1.4, tension: .2,
        pointRadius: single ? 3 : 0, pointHoverRadius: 3.5,
        pointBackgroundColor: LINES[i % LINES.length],
      })),
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: {mode: "index", intersect: false},
      plugins: {
        legend: {display: !!opts.legend,
          labels: {color: "#8f8f8f", boxWidth: 8, font: {size: 9}}},
        tooltip: {displayColors: false,
          backgroundColor: "#111", borderColor: "#3a3a3a", borderWidth: 1,
          titleColor: "#ffa500", bodyColor: "#e6e6e6",
          titleFont: {size: 10, family: "Consolas"},
          bodyFont: {size: 10, family: "Consolas"},
          callbacks: {
            title: items => `REF ${items[0].label}`,
            label: i => `${i.dataset.label || ""} ${fmt(i.parsed.y)}`,
          }},
      },
      scales: {
        x: {ticks: {color: "#777", maxTicksLimit: opts.xticks || 5,
                    font: {size: 9, family: "Consolas"}}, grid: {color: "#161616"}},
        y: {ticks: {color: "#777", maxTicksLimit: 4,
                    font: {size: 9, family: "Consolas"}}, grid: {color: "#161616"}},
      },
    },
  });
}
function spark(canvas, series){
  if (!canvas || typeof Chart === "undefined" || !series || !series.points.length) return;
  new Chart(canvas, {
    type: "line",
    data: {
      labels: series.points.map(p => p[0]),
      datasets: [{data: series.points.map(p => p[1]), borderColor: AMBER,
                  backgroundColor: "rgba(255,165,0,.10)", fill: true,
                  borderWidth: 1.1, pointRadius: 0, pointHoverRadius: 3,
                  tension: .25}],
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: {mode: "index", intersect: false},
      plugins: {legend: {display: false},
        tooltip: {displayColors: false, backgroundColor: "#111",
          borderColor: "#3a3a3a", borderWidth: 1, titleColor: "#ffa500",
          bodyColor: "#e6e6e6", titleFont: {size: 10, family: "Consolas"},
          bodyFont: {size: 10, family: "Consolas"},
          callbacks: {title: items => `REF ${items[0].label}`,
                      label: i => ` ${fmt(i.parsed.y)}`}}},
      scales: {x: {display: false}, y: {display: false}},
    },
  });
}
function boxShell(mod, inner){
  const btn = mod.page
    ? `<a class="go" href="${mod.page}" title="상세 내역">DETAIL ↗</a>`
    : `<span class="go off" title="상세는 로컬 Flask 서버에서 제공">LOCAL</span>`;
  const el = document.createElement("div");
  el.innerHTML = `<section class="box">
    <header><span class="code">${mod.id.toUpperCase()}</span>
      <span class="ttl">${mod.title}</span>
      <span class="ref">${mod.updated ? "REF " + mod.updated : ""}</span>${btn}</header>
    <div class="body">${inner}</div>
  </section>`;
  return el.firstElementChild;
}
function errHtml(mod){ return mod.error ? `<div class="err">${mod.error}</div>` : ""; }

/* 2단: 숫자+증감+기준일 상단, 각 하단 그래프 (sea, linerlytica) */
function duoBox(mod){
  const cells = mod.metrics.slice(0, 2).map((m, i) => `
    <div class="cell">
      <div class="lbl">${m.label}${m.asof && m.asof !== mod.updated ? ` · ${m.asof}` : ""}</div>
      <div class="val">${fmt(m.value)}${unitHtml(m.unit)}</div>
      ${chgHtml(m)}
      <div class="chartbox"><canvas data-s="${i}"></canvas></div>
    </div>`).join("");
  const box = boxShell(mod, `<div class="duo">${cells}</div>` + errHtml(mod));
  box.querySelectorAll("canvas").forEach(cv =>
    lineChart(cv, [mod.series[Number(cv.dataset.s) || 0]].filter(Boolean)));
  return box;
}
/* forwarders: 1위만 — 국기(이미지)+회사명 상단, REV/TEU/TON 하단 */
const ISO = {
  "Denmark":"DK","Switzerland":"CH","Germany":"DE","France":"FR",
  "United States":"US","USA":"US","Japan":"JP","China":"CN",
  "United Kingdom":"GB","Netherlands":"NL","Spain":"ES","Italy":"IT",
  "Sweden":"SE","Norway":"NO","South Korea":"KR","Korea":"KR",
  "Singapore":"SG","United Arab Emirates":"AE","Belgium":"BE",
  "Austria":"AT","Canada":"CA","Australia":"AU","Hong Kong":"HK",
  "Taiwan":"TW","India":"IN","Brazil":"BR","Mexico":"MX","Turkey":"TR",
  "Finland":"FI","Ireland":"IE","Luxembourg":"LU","Portugal":"PT",
  "Greece":"GR","Israel":"IL","Saudi Arabia":"SA","Thailand":"TH",
  "Vietnam":"VN","Malaysia":"MY","Indonesia":"ID","Poland":"PL",
  "South Africa":"ZA","New Zealand":"NZ",
};
function flagUrl(hq){
  const cc = (ISO[hq] || "").toLowerCase();
  if (!cc) return "";
  const cps = [...cc].map(c => (0x1F1E6 + c.charCodeAt(0) - 97).toString(16)).join("-");
  return `https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/${cps}.svg`;
}
function fwdBox(mod){
  const t = mod.top1 || {};
  const trio = (mod.metrics || []).slice(0, 3).map(m => `
    <div class="cell">
      <div class="lbl">${m.label}</div>
      <div class="val">${fmt(m.value)}${unitHtml(m.unit)}</div>
      ${chgHtml(m)}${m.prev_asof ? `<span class="chg flat"> vs ${m.prev_asof}</span>` : ""}
    </div>`).join("");
  return boxShell(mod,
    `<div class="fwdhead"><img class="flagimg" src="${flagUrl(t.hq)}"
        alt="${ISO[t.hq] || ""}">
       <span class="fname">${t.name || "-"}</span><span class="rk1">#1</span></div>
     <div class="trio">${trio}</div>` + errHtml(mod));
}
/* air: 항로 3지수 상단 + 3라인 그래프 */
function airBox(mod){
  const trio = mod.metrics.slice(0, 3).map(m => `
    <div class="cell">
      <div class="lbl">${ROUTE_SHORT[m.label] || m.label}</div>
      <div class="val">${fmt(m.value)}</div>
      ${chgHtml(m)}
    </div>`).join("");
  const overall = mod.metrics[3];
  const box = boxShell(mod,
    `<div class="trio">${trio}</div>` +
    (overall ? `<div class="subrow">
        <span class="lbl" style="margin:0">TAC 종합</span>
        <span class="v">${fmt(overall.value)}${chgHtml(overall)}</span></div>` : "") +
    `<div class="chartbox"><canvas></canvas></div>` +
    errHtml(mod));
  lineChart(box.querySelector("canvas"), mod.series.slice(0, 3),
            {legend: true, xticks: 4});
  return box;
}
/* oil: 좌 CRUDE / 우 VLSFO, 각 3숫자 + 3스파크라인 */
function oilBox(mod){
  const cells = (mod.groups || []).map((g, gi) => {
    const gdate = g.metrics.map(m => m.asof).filter(Boolean).sort().pop();
    return `
    <div class="cell">
      <div class="celltitle">${g.title}${gdate && gdate !== mod.updated ? ` · ${gdate}` : ""}</div>
      ${g.metrics.map((m, i) => `
        <div class="mini">
          <div class="row">
            <span class="lbl" style="margin:0">${m.label}</span>
            <span class="v">${fmt(m.value)}${unitHtml(m.unit)}</span>
          </div>
          <div class="row">${chgHtml(m)}<span></span></div>
          <div class="sparkbox"><canvas data-g="${gi}" data-s="${i}"></canvas></div>
        </div>`).join("")}
    </div>`;
  }).join("");
  const box = boxShell(mod,
    `<div class="duo">${cells}</div>` +
    (mod.note ? `<div class="asof">VLSFO DIAG: ${mod.note}</div>` : "") +
    errHtml(mod));
  box.querySelectorAll("canvas").forEach(cv => {
    const g = mod.groups[Number(cv.dataset.g)];
    spark(cv, g && g.series[Number(cv.dataset.s)]);
  });
  return box;
}
/* macro: 지표별 숫자 상단 + 그래프 하단 3단 스택 */
function macroBox(mod){
  const stack = (mod.groups || []).map((g, gi) => {
    const m = g.metrics[0] || {};
    return `<div class="grp">
      <div class="row">
        <span class="lbl" style="margin:0">${g.title}${m.asof && m.asof !== mod.updated ? ` · ${m.asof}` : ""}</span>
        <span class="v">${fmt(m.value)}${unitHtml(m.unit)}</span>
      </div>
      <div class="row">${chgHtml(m)}<span></span></div>
      <div class="chartbox"><canvas data-g="${gi}"></canvas></div>
    </div>`;
  }).join("");
  const box = boxShell(mod, `<div class="stack">${stack}</div>` + errHtml(mod));
  box.querySelectorAll("canvas").forEach(cv =>
    lineChart(cv, [mod.groups[Number(cv.dataset.g)].series[0]], {xticks: 4}));
  return box;
}
const RENDERERS = {
  sea: duoBox, linerlytica: duoBox, alphaliner: duoBox,
  forwarders: fwdBox, air: airBox, oil: oilBox, macro: macroBox,
};
async function load(){
  const grid = document.getElementById("grid");
  let summary = null;
  try {
    summary = await (await fetch("summary.json?t=" + Date.now())).json();
  } catch (e) {
    document.getElementById("meta").textContent =
      "summary.json 없음 — run_all.py 실행 필요";
    return;
  }
  document.getElementById("meta").textContent =
    `DATA ${summary.generated_at || "-"}`;
  document.getElementById("footmeta").textContent =
    `SUMMARY GENERATED ${summary.generated_at || "-"}`;
  (summary.modules || []).forEach(mod => {
    const render = RENDERERS[mod.id] || duoBox;
    grid.appendChild(render(mod));
  });
}
load();
</script>
</body>
</html>
