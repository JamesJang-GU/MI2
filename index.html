<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MI2 국제운송 통합 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0b0e14; --panel:#121722; --panel2:#0e131d; --line:#232b3a;
    --txt:#e6edf3; --dim:#8b98ab; --accent:#ffb347; --up:#3fb950; --down:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:"Segoe UI",system-ui,-apple-system,"Malgun Gothic",sans-serif}
  header{padding:18px 20px 10px;border-bottom:1px solid var(--line);
         position:sticky;top:0;background:rgba(11,14,20,.92);backdrop-filter:blur(6px);z-index:5}
  h1{margin:0;font-size:19px;letter-spacing:.06em}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:12px;margin-top:6px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:11px}
  .chip.ok{color:var(--up);border-color:#1d4429}
  .chip.fail{color:var(--down);border-color:#5a2430}
  main{padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .card h2{margin:0;font-size:14px;letter-spacing:.04em;color:var(--accent);
           display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card h2 a{color:var(--dim);font-size:11px;text-decoration:none;border:1px solid var(--line);
             border-radius:6px;padding:2px 8px;white-space:nowrap}
  .card h2 a:hover{color:var(--txt);border-color:var(--dim)}
  .asof{color:var(--dim);font-size:11px}
  .metrics{display:flex;flex-wrap:wrap;gap:8px}
  .metric{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
          padding:8px 10px;min-width:104px;flex:1}
  .metric .lbl{color:var(--dim);font-size:11px;margin-bottom:4px}
  .metric .val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
  .metric .chg{font-size:11px;margin-left:6px}
  .up{color:var(--up)} .down{color:var(--down)}
  .chartbox{height:150px;position:relative}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;
        font-variant-numeric:tabular-nums;white-space:nowrap}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  th{color:var(--dim);font-weight:500}
  .tblwrap{overflow-x:auto}
  .tbl-label{color:var(--dim);font-size:11px;margin-bottom:2px}
  .err{color:var(--down);font-size:12px}
  footer{color:var(--dim);font-size:11px;padding:10px 20px 26px;text-align:center}
  @media (max-width:480px){
    main{grid-template-columns:1fr;padding:10px}
    .metric .val{font-size:15px}
  }
</style>
</head>
<body>
<header>
  <h1>MI2 <span>국제운송 통합 대시보드</span></h1>
  <div class="sub" id="meta">데이터 로딩 중…</div>
</header>
<main id="grid"></main>
<footer id="foot"></footer>
<script>
const COLORS = ["#ffb347","#58a6ff","#3fb950","#bc8cff","#f778ba","#79c0ff"];

function fmt(v){
  if (v === null || v === undefined) return "-";
  const n = Number(v);
  if (!isFinite(n)) return String(v);
  return n.toLocaleString("ko-KR", {maximumFractionDigits: 2});
}
function chgHtml(m){
  if (m.change === null || m.change === undefined) return "";
  const up = m.change >= 0;
  const unit = m.change_unit === "%" ? "%" : (m.change_unit === "p" ? "p" : "");
  return `<span class="chg ${up ? "up" : "down"}">${up ? "▲" : "▼"}${fmt(Math.abs(m.change))}${unit}</span>`;
}

function card(mod, run){
  const el = document.createElement("section");
  el.className = "card";
  const link = mod.page
    ? `<a href="${mod.page}">상세 ↳</a>` : "";
  const status = run
    ? (run.ok ? `<span class="chip ok">크롤링 OK</span>`
              : `<span class="chip fail">크롤링 실패</span>`)
    : "";
  const metrics = (mod.metrics || []).map(m => `
    <div class="metric">
      <div class="lbl">${m.label}${m.asof ? ` <span class="asof">(${m.asof})</span>` : ""}</div>
      <div class="val">${fmt(m.value)}${chgHtml(m)}</div>
    </div>`).join("");
  const tables = (mod.tables || []).map(t => `
    <div>
      <div class="tbl-label">${t.label}</div>
      <div class="tblwrap"><table>
        <tr>${t.columns.map(c => `<th>${c}</th>`).join("")}</tr>
        ${t.rows.map(r => `<tr>${r.map(c => `<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}
      </table></div>
    </div>`).join("");
  const err = mod.error ? `<div class="err">요약 추출 실패: ${mod.error}</div>` : "";
  el.innerHTML = `
    <h2>${mod.title} ${status}${link}</h2>
    <div class="asof">기준일: ${mod.updated || "-"}</div>
    <div class="metrics">${metrics || '<span class="asof">표시 데이터 없음</span>'}</div>
    ${(mod.series && mod.series.length) ? '<div class="chartbox"><canvas></canvas></div>' : ""}
    ${tables}${err}`;
  return el;
}

function drawChart(el, series){
  const canvas = el.querySelector("canvas");
  if (!canvas || typeof Chart === "undefined") return;
  const labels = series[0].points.map(p => p[0]);
  new Chart(canvas, {
    type: "line",
    data: {
      labels,
      datasets: series.slice(0, 3).map((s, i) => ({
        label: s.label,
        data: s.points.map(p => p[1]),
        borderColor: COLORS[i % COLORS.length],
        backgroundColor: "transparent",
        borderWidth: 1.6,
        pointRadius: 0,
        tension: .25,
      })),
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: {mode: "index", intersect: false},
      plugins: {legend: {labels: {color: "#8b98ab", boxWidth: 10, font: {size: 10}}}},
      scales: {
        x: {ticks: {color: "#8b98ab", maxTicksLimit: 6, font: {size: 9}},
            grid: {color: "#1a2130"}},
        y: {ticks: {color: "#8b98ab", font: {size: 9}}, grid: {color: "#1a2130"}},
      },
    },
  });
}

async function load(){
  const grid = document.getElementById("grid");
  let summary = null, status = null;
  try { summary = await (await fetch("summary.json?t=" + Date.now())).json(); }
  catch (e) { document.getElementById("meta").textContent = "summary.json 을 불러올 수 없습니다. run_all.py 를 먼저 실행하세요."; return; }
  try { status = await (await fetch("status.json?t=" + Date.now())).json(); } catch (e) {}
  const runs = {};
  (status && status.runs || []).forEach(r => runs[r.module] = r);

  const chips = (summary.modules || []).map(m => {
    const r = runs[m.id];
    if (!r) return "";
    return `<span class="chip ${r.ok ? "ok" : "fail"}">${m.id} ${r.ok ? "OK" : "FAIL"}</span>`;
  }).join("");
  document.getElementById("meta").innerHTML =
    `데이터 생성: ${summary.generated_at || "-"} ${status ? `· 크롤링: ${status.generated_at}` : ""} ${chips}`;

  (summary.modules || []).forEach(mod => {
    const el = card(mod, runs[mod.id]);
    grid.appendChild(el);
    if (mod.series && mod.series.length) drawChart(el, mod.series);
  });
  document.getElementById("foot").textContent =
    "MI2 · 매일 KST 00:00 GitHub Actions 자동 크롤링 · 모듈별 상세 페이지는 카드 우측 상단 링크";
}
load();
</script>
</body>
</html>
