<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>MI Terminal | TAC Airfreight Index</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #02060b;
      --panel: #07111c;
      --panel2: #0a1724;
      --line: #1c3448;
      --text: #f1f6fa;
      --muted: #8298aa;
      --amber: #f6a623;
      --cyan: #39c7e2;
      --blue: #42a8f5;
      --green: #35ca82;
      --red: #ff6565;
      --purple: #b791ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 44px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: #06101a;
    }

    .brand {
      color: white;
      font-weight: 900;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .brand-mark {
      display: inline-block;
      margin-right: 10px;
      padding: 4px 7px;
      color: #02060b;
      background: var(--amber);
    }

    .meta {
      color: var(--muted);
      font-size: 10px;
      text-align: right;
    }

    .meta a {
      color: var(--cyan);
      text-decoration: none;
    }

    .terminal {
      width: min(1600px, calc(100% - 24px));
      margin: 12px auto 24px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .kpi {
      padding: 12px;
      border: 1px solid var(--line);
      border-top: 2px solid var(--blue);
      background: var(--panel);
    }

    .kpi.amber {
      border-top-color: var(--amber);
    }

    .kpi.green {
      border-top-color: var(--green);
    }

    .kpi.purple {
      border-top-color: var(--purple);
    }

    .kpi-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .06em;
    }

    .kpi-value {
      margin-top: 8px;
      font-size: 22px;
      font-weight: 900;
      text-align: right;
    }

    .kpi-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
      text-align: right;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel2);
    }

    .panel-title {
      color: var(--amber);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .06em;
    }

    .panel-meta {
      color: var(--muted);
      font-size: 9px;
    }

    .panel-body {
      padding: 10px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 10px;
    }

    .route-btn {
      padding: 5px 8px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #040c14;
      cursor: pointer;
      font-family: inherit;
      font-size: 9px;
    }

    .route-btn.active {
      color: #02060b;
      border-color: var(--amber);
      background: var(--amber);
    }

    .chart-wrap {
      position: relative;
      height: 410px;
    }

    .table-wrap {
      max-height: 455px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
    }

    th {
      position: sticky;
      top: 0;
      padding: 8px;
      color: var(--amber);
      border-bottom: 1px solid var(--line);
      background: var(--panel2);
      font-size: 9px;
      text-align: right;
    }

    td {
      padding: 8px;
      border-bottom: 1px solid #132536;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    .status {
      margin-top: 10px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--green);
      color: var(--muted);
      background: #02070d;
      font-size: 10px;
    }

    .up {
      color: var(--green);
      font-weight: 800;
    }

    .down {
      color: var(--red);
      font-weight: 800;
    }

    .flat {
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .kpis {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .meta {
        display: none;
      }
    }

    @media (max-width: 520px) {
      .kpis {
        grid-template-columns: 1fr;
      }

      .terminal {
        width: calc(100% - 16px);
      }
    }
  </style>
</head>

  <script>
    (function () {
      "use strict";

      var DATA = JSON.parse(
        document.getElementById("tac-data").textContent
      );

      var selectedRoutes = {};
      var chart = null;

      var colors = [
        "#f6a623",
        "#42a8f5",
        "#35ca82",
        "#b791ff",
        "#ff6565",
        "#39c7e2"
      ];

      function number(value, digits) {
        if (
          value === null ||
          value === undefined ||
          isNaN(Number(value))
        ) {
          return "--";
        }

        return Number(value).toLocaleString("en-US", {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        });
      }

      function percent(value) {
        if (
          value === null ||
          value === undefined ||
          isNaN(Number(value))
        ) {
          return "--";
        }

        var numericValue = Number(value);

        return (
          (numericValue >= 0 ? "+" : "") +
          numericValue.toFixed(2) +
          "%"
        );
      }

      function deltaClass(value) {
        if (value === null || value === undefined) {
          return "flat";
        }

        if (Number(value) > 0) {
          return "up";
        }

        if (Number(value) < 0) {
          return "down";
        }

        return "flat";
      }

      function arrow(value) {
        if (value === null || value === undefined) {
          return "";
        }

        if (Number(value) > 0) {
          return "▲ ";
        }

        if (Number(value) < 0) {
          return "▼ ";
        }

        return "";
      }

      function getSeriesMap() {
        var result = {};

        ((DATA.raw_dataset || {}).series || []).forEach(
          function (item) {
            result[item.name] = item;
          }
        );

        return result;
      }

      function renderKpi() {
        var history = DATA.history || [];
        var latest = history.length
          ? history[history.length - 1]
          : null;

        var detail = DATA.latest_detail || [];

        var cards = [
          {
            label: "LATEST DATE",
            value: latest ? latest.data_date : "--",
            sub: "SOURCE OBSERVATION",
            cls: ""
          },
          {
            label: "ROUTE SPOT AVERAGE",
            value: latest
              ? "$" + number(latest.overall_index, 2)
              : "--",
            sub: "USD / KG",
            cls: "amber"
          },
          {
            label: "PERIODIC DELTA",
            value: latest &&
              latest.weekly_change !== null
              ? '<span class="' +
                deltaClass(latest.weekly_change) +
                '">' +
                arrow(latest.weekly_change) +
                percent(latest.weekly_change) +
                "</span>"
              : "--",
            sub: "AVERAGE ROUTE CHANGE",
            cls: "purple"
          },
          {
            label: "TRACKED CORRIDORS",
            value: (
              latest
                ? latest.route_count
                : detail.length
            ) + " PAIRS",
            sub: "ACTIVE ROUTES",
            cls: "green"
          }
        ];

        document.getElementById("kpi-area").innerHTML =
          cards.map(function (card) {
            return (
              '<div class="kpi ' + card.cls + '">' +
                '<div class="kpi-label">' +
                  card.label +
                "</div>" +
                '<div class="kpi-value">' +
                  card.value +
                "</div>" +
                '<div class="kpi-sub">' +
                  card.sub +
                "</div>" +
              "</div>"
            );
          }).join("");
      }

      function renderButtons() {
        var routeMap = getSeriesMap();
        var routes = Object.keys(routeMap);
        var target = document.getElementById("route-buttons");

        routes.forEach(function (route) {
          if (selectedRoutes[route] === undefined) {
            selectedRoutes[route] = true;
          }
        });

        target.innerHTML = routes.map(function (route) {
          return (
            '<button class="route-btn ' +
            (selectedRoutes[route] ? "active" : "") +
            '" data-route="' +
            route +
            '">' +
            route.toUpperCase() +
            "</button>"
          );
        }).join("");

        target.querySelectorAll(".route-btn").forEach(
          function (button) {
            button.addEventListener("click", function () {
              var route = button.getAttribute("data-route");

              selectedRoutes[route] = !selectedRoutes[route];

              var activeRoutes = Object.keys(
                selectedRoutes
              ).filter(function (key) {
                return selectedRoutes[key];
              });

              if (!activeRoutes.length) {
                selectedRoutes[route] = true;
              }

              renderButtons();
              renderChart();
            });
          }
        );
      }

      function renderChart() {
        if (typeof Chart === "undefined") {
          return;
        }

        var routeMap = getSeriesMap();
        var labels = (
          (DATA.raw_dataset || {}).labels || []
        );

        var activeRoutes = Object.keys(routeMap).filter(
          function (route) {
            return selectedRoutes[route];
          }
        );

        var datasets = activeRoutes.map(
          function (route, index) {
            var color = colors[index % colors.length];

            return {
              label: route.toUpperCase(),
              data: routeMap[route].values,
              borderColor: color,
              backgroundColor: color + "18",
              borderWidth: 2,
              tension: 0.12,
              spanGaps: true,
              pointRadius: 1.5,
              pointHoverRadius: 4,
              pointBackgroundColor: color
            };
          }
        );

        if (chart) {
          chart.data.labels = labels;
          chart.data.datasets = datasets;
          chart.update();
          return;
        }

        chart = new Chart(
          document.getElementById("chart").getContext("2d"),
          {
            type: "line",
            data: {
              labels: labels,
              datasets: datasets
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: {
                mode: "index",
                intersect: false
              },
              plugins: {
                legend: {
                  position: "top",
                  align: "end",
                  labels: {
                    color: "#8298aa",
                    boxWidth: 10,
                    font: {
                      family: "Consolas, monospace",
                      size: 9
                    }
                  }
                },
                tooltip: {
                  backgroundColor: "#07111c",
                  titleColor: "#f6a623",
                  bodyColor: "#f1f6fa",
                  borderColor: "#2b506d",
                  borderWidth: 1,
                  callbacks: {
                    label: function (context) {
                      return (
                        " " +
                        context.dataset.label +
                        ": $" +
                        number(context.parsed.y, 2) +
                        " / kg"
                      );
                    }
                  }
                }
              },
              scales: {
                x: {
                  ticks: {
                    color: "#8298aa",
                    maxTicksLimit: 12,
                    font: {
                      family: "Consolas, monospace",
                      size: 8
                    }
                  },
                  grid: {
                    color: "rgba(28, 52, 72, 0.4)"
                  }
                },
                y: {
                  title: {
                    display: true,
                    text: "USD / KG",
                    color: "#8298aa",
                    font: {
                      family: "Consolas, monospace",
                      size: 8
                    }
                  },
                  ticks: {
                    color: "#8298aa",
                    callback: function (value) {
                      return "$" + Number(value).toFixed(2);
                    }
                  },
                  grid: {
                    color: "rgba(28, 52, 72, 0.4)"
                  }
                }
              }
            }
          }
        );
      }

      function renderWatchlist() {
        var rows = DATA.latest_detail || [];
        var target = document.getElementById("watchlist-body");

        if (!rows.length) {
          target.innerHTML =
            '<tr><td colspan="4" class="flat" ' +
            'style="text-align:center;padding:18px;">' +
            "NO ROUTE RECORDS" +
            "</td></tr>";
          return;
        }

        target.innerHTML = rows.map(function (row) {
          return (
            "<tr>" +
              "<td><strong>" +
                (row.route_code || "--") +
              "</strong></td>" +
              '<td style="font-weight:800;">$' +
                number(row.index_value, 2) +
              "</td>" +
              '<td class="' +
                deltaClass(row.weekly_change) +
                '">' +
                arrow(row.weekly_change) +
                percent(row.weekly_change) +
              "</td>" +
              '<td class="flat">' +
                (row.data_date || "--") +
              "</td>" +
            "</tr>"
          );
        }).join("");
      }

      function renderStatus() {
        var sync = DATA.last_sync || {};
        var status = sync.status || "NO_AUDIT_LOG";
        var detail = sync.message || "Historical data loaded.";

        document.getElementById("status-bar").innerHTML =
          "SYSTEM STATUS: <strong>" +
          status +
          "</strong> | " +
          detail;
      }

      renderKpi();
      renderButtons();
      renderChart();
      renderWatchlist();
      renderStatus();
    })();
  </script>
