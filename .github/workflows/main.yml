name: daily-crawl

# 매일 자정(KST 00:00 = UTC 15:00) 자동 크롤링 + 수동 실행 버튼
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright (linerlytica)
        run: python -m playwright install --with-deps chromium

      - name: Run crawlers & build dashboard data
        env:
          KSG_ID: ${{ secrets.KSG_ID }}
          KSG_PW: ${{ secrets.KSG_PW }}
        run: python run_all.py

      - name: Commit & push updated data
        run: |
          git config user.name "mi2-bot"
          git config user.email "mi2-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: daily crawl $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
